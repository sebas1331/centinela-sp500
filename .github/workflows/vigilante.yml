name: Vigilante

# ---------------------------------------------------------------------------
# La red de seguridad contra el fallo del 2026-07-27.
#
# Los demás workflows comprueban que un run concreto hizo su trabajo. Ninguno
# podía detectar lo contrario: que faltara un run entero. Ese día los cinco
# disparos de la pre-apertura se retrasaron más de dos horas, llegaron pasada la
# apertura, terminaron los cinco en verde y la sesión se perdió. Actions no tenía
# ni un solo run rojo que mirar.
#
# Este workflow pregunta lo único que importa de verdad: ¿tiene el repositorio la
# huella de todas las sesiones que ya deberían estar hechas? Si no, ROJO. Un
# silencio deja de ser invisible.
#
# Corre a diario a las 14:37 UTC, cuando el post-cierre de la sesión anterior ya
# debería llevar horas hecho incluso con el peor retraso de cron observado.
#
# ---------------------------------------------------------------------------
# EL FALLO DEL 2026-08-06 (run 31119690487): 15m02s y rojo
#
# No se colgó el Vigilante: NUNCA LLEGÓ A EJECUTARSE. GitHub no consiguió
# asignarle una máquina ("The job was not acquired by Runner of type hosted even
# after multiple attempts"), el job se quedó encolado 15 minutos y el
# timeout-minutes lo mató. La API de jobs lo confirma: `steps` venía VACÍO, ni
# siquiera corrió "Set up job". Fue una incidencia de infraestructura de Actions,
# ajena a este repositorio, y el trading no se vio afectado (los escaneos del día
# terminaron todos en verde).
#
# Contra eso no hay código que valga: no podemos forzar a GitHub a darnos runner.
# Lo que sí controlamos es CUÁNTO tarda en verse. El timeout baja de 15 a 5
# minutos: un Vigilante sano tarda 30-45 s, así que pasados 5 minutos o está roto
# o no hay máquina, y en ambos casos la respuesta correcta es morir en rojo ya en
# vez de tener el run colgado un cuarto de hora fingiendo que trabaja.
# ---------------------------------------------------------------------------
#
# ---------------------------------------------------------------------------
# POR QUÉ HAY DOS DISPAROS Y NO UNO
#
# El de las 14:37 UTC vigila SILENCIOS: que no falte ninguna sesión ya exigible.
# Para eso da igual la hora, mientras el post-cierre anterior lleve horas hecho.
#
# El de las 07:07 UTC vigila la SESIÓN DE XTB, y ahí la hora lo es todo. El TGT
# dura 8 h y se refresca con el último login del día —el post-cierre, sobre las
# 21:00 UTC—, así que caduca de madrugada, sobre las 05:00. La ventana de
# compras es 09:30-13:10 UTC (10:30-14:10 en invierno). Con un solo disparo a
# las 14:37 el aviso llegaba SIEMPRE después de la ventana: para cuando avisaba,
# el run de compras ya se había encontrado la sesión cerrada.
#
# Las 07:07 caen en el único hueco que sirve: después de la caducidad y con
# 2,4 h de margen antes de que se abra la ventana. Solo días laborables, porque
# el sábado no hay ventana que proteger.
# ---------------------------------------------------------------------------
on:
  schedule:
    - cron: "37 14 * * *"
    - cron: "7 7 * * 1-5"
  workflow_dispatch:
    inputs:
      sesiones:
        description: "Cuántas sesiones exigibles hacia atrás revisar"
        type: string
        default: "1"

# Solo lee. No escribe nada en el repositorio. `actions: read` se añadió para la
# detección de rachas de rojos (emergencia del 2026-08-27): el vigilante consulta
# la API de Actions para ver los runs recientes de los dos escaneos.
permissions:
  contents: read
  actions: read

jobs:
  vigilar:
    runs-on: ubuntu-latest
    outputs:
      resultado: ${{ steps.vigilar.outputs.resultado }}
      detalle: ${{ steps.vigilar.outputs.detalle }}
    # Un Vigilante sano tarda 30-45 s (solo lee ficheros del repo y `git log`; no
    # descarga precios ni llama a ninguna API). Si pasa de 5 minutos está roto por
    # definición, y morir pronto y en rojo es preferible a colgarse.
    timeout-minutes: 5
    steps:
      # Historial completo: el vigilante cuenta commits del bot por fecha.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Solo necesita el calendario bursátil y pandas, no el stack de modelado.
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # MANTIENE VIVA LA CACHÉ DE LA SESIÓN, además de leerla para avisar de
      # que caduca. GitHub borra una caché que nadie usa en 7 días, y el
      # Vigilante es el único que corre TODOS los días —fines de semana
      # incluidos—, así que es el único que puede tocarla siempre. Sin esto, un
      # puente largo se lleva la sesión por delante y el lunes aparece un rojo
      # sorpresa antes de la apertura.
      - name: Restaurar y refrescar la sesión de XTB
        uses: actions/cache@v4
        with:
          path: |
            ~/.centinela_xtb_session
            ~/.centinela_xtb_ticket.json
            ~/.centinela_xtb_cookies.json
          key: xtb-sesion-${{ github.run_id }}
          restore-keys: xtb-sesion-

      # GITHUB_TOKEN es necesario para la consulta de rachas de rojos contra la
      # API de Actions; sin él esa comprobación se anuncia como no aplicable.
      - name: Revisar que no falte ninguna sesión ni haya rachas de rojos
        id: vigilar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/vigilante.py --sesiones "${{ inputs.sesiones || '1' }}"


  # LA PÁGINA DE OPERATIVA, el pulso diario.
  #
  # Este es el ÚNICO de los cuatro que corre TODOS los días, fines de semana
  # incluidos, y por eso es el que mantiene fresca la fecha de generación de la
  # página. Sin él, un puente largo dejaría la página con tres días de antigüedad
  # y el detector del navegador la pintaría de ámbar sin que pasara nada malo.
  #
  # El job de arriba es de SOLO LECTURA a propósito; los permisos de escritura
  # viven aquí y solo aquí.
  # LA SALUD de los componentes de este workflow. Va por el diario: no rebasa,
  # no choca y no tiene grupo de concurrencia, así que GitHub no la puede
  # cancelar por estar esperando turno (ver centinela/diario.py).
  salud:
    needs: [vigilar]
    if: always()
    runs-on: ubuntu-latest
    # El workflow es de solo lectura; este job publica la salud por el diario.
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Registrar el estado del Vigilante
        run: |
          python scripts/registrar_salud.py vigilante \
            --salida "${{ needs.vigilar.outputs.resultado }}" \
            --job "${{ needs.vigilar.result }}" \
            --detalle "${{ needs.vigilar.outputs.detalle }}"

      - name: Publicar la salud (diario, sin rebase)
        run: |
          python scripts/publicar_diario.py --mensaje "salud: Vigilante [skip ci]"

  # LA PÁGINA, regenerada en el grupo ÚNICO `centinela-operativa` que comparten
  # todos los workflows (ver pagina_operativa.yml). Antes cada workflow tenía
  # el suyo y chocaban entre sí: 13 rojos "could not apply" en una semana.
  operativa:
    needs: [salud]
    if: always()
    permissions:
      contents: write
    uses: ./.github/workflows/pagina_operativa.yml
    with:
      mensaje: "operativa: pulso diario del vigilante [skip ci]"

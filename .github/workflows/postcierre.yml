name: Escaneo post-cierre

# ---------------------------------------------------------------------------
# Objetivo: procesar la sesión una vez cerrada (16:00 ET). Aquí la ventana NO
# tiene techo — pasada media hora del cierre, procesar a las 18:00 o a las 22:00
# da exactamente el mismo resultado — así que los retrasos del cron de Actions,
# que llegan a las 3 h, son mucho menos peligrosos que en la pre-apertura.
#
# El único riesgo real es que el retraso sea tan bestia que cruce la MEDIANOCHE
# ET: entonces la fecha rueda al día siguiente y la sesión de ayer se quedaría
# sin procesar. Por eso los disparos salen temprano y el run que llegue antes de
# la ventana duerme hasta que abra en vez de morir.
#
# El 2026-08-27 el scheduler de cron de GitHub se retrasó ~10 h (ver la cabecera
# de preapertura.yml): los cuatro disparos de aquel día, que empezaban a las
# 20:07 UTC, ni siquiera se habían creado a las 01:07 UTC del día siguiente, a
# tres horas de que la fecha ET rodara y la sesión se perdiera. La escalera pasa
# de 4 a 9 peldaños y arranca a las 15:07 UTC (12:07 ET, con el mercado todavía
# abierto: ese peldaño cede el turno en verde en segundos y solo sirve para el
# día en que GitHub vuelva a irse 10 h). Con eso se aguantan retrasos de 0 a
# ~12 h, verificado por test_escalera_de_crons_postcierre_aguanta_retrasos.
#
#   verano  (EDT, cierre 20:00 UTC) -> ventana desde 20:30 UTC, día ET hasta 04:00 UTC
#   invierno (EST, cierre 21:00 UTC) -> ventana desde 21:30 UTC, día ET hasta 05:00 UTC
#
# Minutos "raros" a propósito: la cola de Actions se congestiona en los redondos.
# ---------------------------------------------------------------------------
on:
  schedule:
    - cron: "7 15 * * 1-5"
    - cron: "7 16 * * 1-5"
    - cron: "7 17 * * 1-5"
    - cron: "7 18 * * 1-5"
    - cron: "7 19 * * 1-5"
    - cron: "7 20 * * 1-5"
    - cron: "7 21 * * 1-5"
    - cron: "7 22 * * 1-5"
    - cron: "7 23 * * 1-5"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Forzar (ignora ventana e idempotencia)"
        type: boolean
        default: false
      fecha:
        description: "Fecha de sesión YYYY-MM-DD (opcional)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: centinela-escritura
  cancel-in-progress: false

jobs:
  postcierre:
    runs-on: ubuntu-latest
    # Generoso: el run puede pasarse hasta 120 min dormido esperando su ventana.
    timeout-minutes: 165
    outputs:
      resultado: ${{ steps.escaneo.outputs.resultado }}
    steps:
      # `ref` explícito y no el SHA del evento: ver la explicación en
      # preapertura.yml (fallo del 2026-07-28 por checkout rancio en la cola).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # La clave lleva la fecha, no el id del run: así solo el PRIMER run del
      # día guarda caché nueva. Con una por run, la escalera de la pre-apertura
      # dejaba ~17 cachés de 135 MB al día, llenaba los 10 GB del repositorio en
      # cinco días y GitHub empezaba a desalojar por orden de último uso — y lo
      # que desalojaba era la sesión de XTB, que pesa 359 bytes.
      - name: Fecha de hoy, para la clave de caché
        id: dia
        run: echo "fecha=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restaurar caché de precios
        uses: actions/cache@v4
        with:
          path: .cache
          key: precios-${{ steps.dia.outputs.fecha }}-post
          restore-keys: precios-

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escaneo post-cierre (entradas, salidas, reportes)
        id: escaneo
        run: |
          ARGS=""
          if [ "${{ inputs.forzar }}" = "true" ]; then ARGS="$ARGS --forzar"; fi
          if [ -n "${{ inputs.fecha }}" ]; then ARGS="$ARGS --fecha ${{ inputs.fecha }}"; fi
          python scripts/escaneo_postcierre.py $ARGS

      # Rompe en rojo si el escaneo trabajó pero su salida no llegó al repo.
      - name: Commit y push verificados (bitácora, estado, ATH, reportes)
        run: |
          scripts/commit_y_push.sh \
            "post-cierre: entradas/salidas y reportes [skip ci]" \
            "${{ steps.escaneo.outputs.resultado }}" \
            estado bitacora.csv bitacora.sqlite datos logs reportes

  # Segunda opinión INDEPENDIENTE contra el remoto de verdad (ver preapertura.yml).
  # Depende SOLO de `postcierre`: lo que verifica es que la sesión de trading se
  # persistió, y eso no puede quedar condicionado a que funcione ningún job de
  # reporting o presentación posterior.
  verificar:
    needs: postcierre
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Verificar persistencia en el remoto
        env:
          RESULTADO: ${{ needs.postcierre.outputs.resultado }}
          ESTADO_JOB: ${{ needs.postcierre.result }}
        run: bash scripts/verificar_persistencia.sh

  # Publicación del dashboard de docs/ que sirve GitHub Pages. JOB APARTE porque
  # es presentación, no trading: si revienta, lo único que pasa es que la web se
  # queda con los datos de ayer, mientras que la bitácora, el estado y su
  # verificación contra el remoto quedaron cerrados y en verde dos jobs antes,
  # sin depender de este.
  #
  dashboard:
    needs: postcierre
    if: needs.postcierre.result == 'success' && needs.postcierre.outputs.resultado == 'procesado'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `ref` explícito (la punta de la rama, no el SHA del evento): aquí ya
      # commiteó `postcierre` y el dashboard tiene que leer esos datos, no los
      # de antes de que este run empezara.
      # `fetch-depth: 0` porque el sello de "última actualización" sale de un
      # `git log` sobre los ficheros de datos: con un clon superficial saldría
      # una fecha falsa.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Misma caché que usan los escaneos: aquí solo se lee y se completa el
      # incremento del día. Sin ella este job pediría a yfinance el historial
      # entero por su cuenta, duplicando trabajo y tentando al rate-limit.
      - name: Restaurar caché de precios
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: precios-
          restore-keys: precios-

      - name: Generar dashboard
        id: dash
        run: python scripts/generar_dashboard.py

      # Solo se commitea si el generador dice que cambió algo, y entonces se
      # exige de verdad: commit, push y confirmación contra el remoto. Así se
      # evita el commit diario de ruido sin comprarlo al precio de dejar de
      # comprobar la persistencia cuando sí había algo que guardar.
      - name: Commit y push del dashboard
        if: steps.dash.outputs.cambios == 'si'
        run: |
          scripts/commit_y_push.sh \
            "dashboard: republicado tras el post-cierre [skip ci]" \
            "procesado" \
            docs

  # Traduce las decisiones del escaneo a órdenes concretas para el broker y las
  # deja en ordenes/pendientes.json, que es lo que el ejecutor del Mac lee al
  # despertarse. JOB APARTE, como el dashboard: si esto falla, la sesión de
  # trading ya está persistida y verificada dos jobs antes. Lo único que pasa
  # es que ese día no se opera en XTB, y el Vigilante lo denuncia.
  #
  # No habla con XTB ni tiene credenciales: solo escribe un fichero.
  ordenes:
    needs: postcierre
    if: needs.postcierre.result == 'success' && needs.postcierre.outputs.resultado == 'procesado'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Restaurar caché de precios
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: precios-
          restore-keys: precios-

      - name: Generar las órdenes del día
        run: python scripts/generar_ordenes.py postcierre

      - name: Commit y push de las órdenes
        run: |
          scripts/commit_y_push.sh \
            "órdenes para el broker: postcierre [skip ci]" \
            "procesado" \
            ordenes

  # EL EJECUTOR. Manda a XTB lo que el escaneo decidió, en un JOB APARTE con
  # `needs`: cuando corre, la bitácora y el estado ya están persistidos y
  # VERIFICADOS contra el remoto. Un fallo del broker se ve en rojo y no
  # revierte ni bloquea nada de la sesión de trading.
  #
  # Vivía en un Mac con launchd porque las credenciales de XTB abren también
  # las cuentas reales del titular. Con esas cuentas vacías ese motivo
  # desapareció, y lo otro —si el login de xStation5 funciona desde una IP de
  # datacenter— se comprobó con `probar_broker.yml`: funciona, y reutilizando
  # la sesión de la caché conecta en 2 segundos sin pedir segundo factor.
  ejecutor:
    # `needs: ordenes` NO es decorativo (fallo del 2026-09-29). Antes colgaba
    # solo del escaneo, igual que `ordenes`, así que los dos jobs arrancaban EL
    # MISMO SEGUNDO: el 29/09 a las 12:45:53 los dos, el ejecutor hizo checkout
    # a las 12:45:55 y las órdenes se empujaron a las 12:46:18. El ejecutor leyó
    # una copia rancia del fichero de órdenes. Aquel día no se notó porque había
    # 0 órdenes de todas formas; con decisiones habría enviado nada y terminado
    # en verde. Ahora espera a que las órdenes estén escritas y empujadas.
    needs: [postcierre, ordenes]
    if: needs.postcierre.result == 'success' && needs.postcierre.outputs.resultado == 'procesado' && needs.ordenes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-broker.txt

      # El login de xStation5 pasa por un WAF que bloquea el camino REST, así
      # que la librería cae a un navegador de verdad.
      - name: Instalar Chromium para el login
        uses: ./.github/actions/chromium

      # La sesión de XTB dura 8 h y cada runner es una máquina nueva. Sin esta
      # caché, XTB trataría cada ejecución como un dispositivo nuevo y pediría
      # un código por correo que aquí no hay quien lea.
      - name: Restaurar sesión de XTB
        uses: actions/cache@v4
        with:
          path: |
            ~/.centinela_xtb_session
            ~/.centinela_xtb_ticket.json
            ~/.centinela_xtb_cookies.json
          key: xtb-sesion-${{ github.run_id }}
          restore-keys: xtb-sesion-

      - name: Ejecutar en el broker (reconcilia)
        id: ejecutor
        env:
          XTB_EMAIL: ${{ secrets.XTB_EMAIL }}
          XTB_CUENTA: ${{ secrets.XTB_CUENTA }}
          XTB_PASSWORD: ${{ secrets.XTB_PASSWORD }}
        run: python scripts/ejecutor_xtb.py reconcilia --sin-git

      # Se commitea SIEMPRE que el ejecutor haya escrito algo, aunque terminara
      # en rojo: si mandó tres órdenes y falló en la cuarta, las tres primeras
      # tienen que quedar registradas o el siguiente disparo las repetiría.
      # POR EL DIARIO, NO POR REBASE (incidente del 2026-10-02). Lo que el
      # broker hizo se aplica sobre el origin más nuevo y se reintenta desde
      # cero si otro empujó entretanto: no puede chocar ni perderse. Siempre,
      # aunque el paso anterior muriera: lo que sí salió tiene que quedar.
      - name: Publicar lo ejecutado (diario, sin rebase)
        if: always()
        run: |
          python scripts/publicar_diario.py --mensaje "ejecutor XTB: reconcilia [skip ci]"

  # LA PÁGINA DE OPERATIVA. Mismo razonamiento que en la pre-apertura: job
  # aparte, el último de todos, con `needs` para no poder tocar nada de lo ya
  # persistido y con `always()` para que los días malos también se publiquen.
  #
  # Depende también del `dashboard` porque los dos escriben en docs/: así se
  # empujan en fila y no se pelean por la punta de la rama.
  # LA SALUD de los componentes de este workflow. Va por el diario: no rebasa,
  # no choca y no tiene grupo de concurrencia, así que GitHub no la puede
  # cancelar por estar esperando turno (ver centinela/diario.py).
  salud:
    needs: [postcierre, dashboard, ejecutor]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Registrar el estado del escaneo
        run: |
          python scripts/registrar_salud.py postcierre \
            --salida "${{ needs.postcierre.outputs.resultado }}" \
            --job "${{ needs.postcierre.result }}"

      - name: Registrar el estado de la reconciliación
        run: |
          python scripts/registrar_salud.py reconcilia \
            --job "${{ needs.ejecutor.result }}" --solo-si-falta

      - name: Publicar la salud (diario, sin rebase)
        run: |
          python scripts/publicar_diario.py --mensaje "salud: post-cierre [skip ci]"

  # LA PÁGINA, regenerada en el grupo ÚNICO `centinela-operativa` que comparten
  # todos los workflows (ver pagina_operativa.yml). Antes cada workflow tenía
  # el suyo y chocaban entre sí: 13 rojos "could not apply" en una semana.
  operativa:
    needs: [salud]
    if: always()
    permissions:
      contents: write
    uses: ./.github/workflows/pagina_operativa.yml
    with:
      mensaje: "operativa: republicada tras el post-cierre [skip ci]"

name: Escaneo post-cierre

# ---------------------------------------------------------------------------
# Objetivo: procesar la sesión una vez cerrada (16:00 ET). Aquí la ventana NO
# tiene techo — pasada media hora del cierre, procesar a las 18:00 o a las 22:00
# da exactamente el mismo resultado — así que los retrasos del cron de Actions,
# que llegan a las 3 h, son mucho menos peligrosos que en la pre-apertura.
#
# El único riesgo real es que el retraso sea tan bestia que cruce la MEDIANOCHE
# ET: entonces la fecha rueda al día siguiente y la sesión de ayer se quedaría
# sin procesar. Por eso los disparos salen temprano y el run que llegue antes de
# la ventana duerme hasta que abra en vez de morir.
#
# El 2026-08-27 el scheduler de cron de GitHub se retrasó ~10 h (ver la cabecera
# de preapertura.yml): los cuatro disparos de aquel día, que empezaban a las
# 20:07 UTC, ni siquiera se habían creado a las 01:07 UTC del día siguiente, a
# tres horas de que la fecha ET rodara y la sesión se perdiera. La escalera pasa
# de 4 a 9 peldaños y arranca a las 15:07 UTC (12:07 ET, con el mercado todavía
# abierto: ese peldaño cede el turno en verde en segundos y solo sirve para el
# día en que GitHub vuelva a irse 10 h). Con eso se aguantan retrasos de 0 a
# ~12 h, verificado por test_escalera_de_crons_postcierre_aguanta_retrasos.
#
#   verano  (EDT, cierre 20:00 UTC) -> ventana desde 20:30 UTC, día ET hasta 04:00 UTC
#   invierno (EST, cierre 21:00 UTC) -> ventana desde 21:30 UTC, día ET hasta 05:00 UTC
#
# Minutos "raros" a propósito: la cola de Actions se congestiona en los redondos.
# ---------------------------------------------------------------------------
on:
  schedule:
    - cron: "7 15 * * 1-5"
    - cron: "7 16 * * 1-5"
    - cron: "7 17 * * 1-5"
    - cron: "7 18 * * 1-5"
    - cron: "7 19 * * 1-5"
    - cron: "7 20 * * 1-5"
    - cron: "7 21 * * 1-5"
    - cron: "7 22 * * 1-5"
    - cron: "7 23 * * 1-5"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Forzar (ignora ventana e idempotencia)"
        type: boolean
        default: false
      fecha:
        description: "Fecha de sesión YYYY-MM-DD (opcional)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: centinela-escritura
  cancel-in-progress: false

jobs:
  postcierre:
    runs-on: ubuntu-latest
    # Generoso: el run puede pasarse hasta 120 min dormido esperando su ventana.
    timeout-minutes: 165
    outputs:
      resultado: ${{ steps.escaneo.outputs.resultado }}
    steps:
      # `ref` explícito y no el SHA del evento: ver la explicación en
      # preapertura.yml (fallo del 2026-07-28 por checkout rancio en la cola).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restaurar caché de precios
        uses: actions/cache@v4
        with:
          path: .cache
          key: precios-${{ github.run_id }}
          restore-keys: precios-

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escaneo post-cierre (entradas, salidas, reportes)
        id: escaneo
        run: |
          ARGS=""
          if [ "${{ inputs.forzar }}" = "true" ]; then ARGS="$ARGS --forzar"; fi
          if [ -n "${{ inputs.fecha }}" ]; then ARGS="$ARGS --fecha ${{ inputs.fecha }}"; fi
          python scripts/escaneo_postcierre.py $ARGS

      # Rompe en rojo si el escaneo trabajó pero su salida no llegó al repo.
      - name: Commit y push verificados (bitácora, estado, ATH, reportes)
        run: |
          scripts/commit_y_push.sh \
            "post-cierre: entradas/salidas y reportes [skip ci]" \
            "${{ steps.escaneo.outputs.resultado }}" \
            estado bitacora.csv bitacora.sqlite datos logs reportes

  # Segunda opinión INDEPENDIENTE contra el remoto de verdad (ver preapertura.yml).
  # OJO: depende solo de `postcierre`, no de `mfe` de abajo. El análisis MFE/MAE
  # es un reporte extra de solo lectura; si falla, la sesión de trading YA está
  # persistida y verificada por este job exactamente igual que antes de que
  # existiera el análisis MFE. Un fallo del reporte no puede volver rojo lo que
  # ya es un éxito real.
  verificar:
    needs: postcierre
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Verificar persistencia en el remoto
        env:
          RESULTADO: ${{ needs.postcierre.outputs.resultado }}
          ESTADO_JOB: ${{ needs.postcierre.result }}
        run: bash scripts/verificar_persistencia.sh

  # Análisis MFE/MAE de las posiciones (solo lectura y reporting; no toca
  # objetivos, stops ni el modelo). Deliberadamente en un JOB APARTE, no como un
  # paso más del job `postcierre`: si este análisis falla (p.ej. yfinance caído),
  # NO debe impedir que la persistencia crítica de arriba (bitácora, estado)
  # quede a salvo. Solo corre si el escaneo de hoy trabajó de verdad
  # (resultado=procesado); si otro disparo ya procesó la sesión, no tiene sentido
  # repetir las descargas.
  mfe:
    needs: postcierre
    if: needs.postcierre.result == 'success' && needs.postcierre.outputs.resultado == 'procesado'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Análisis MFE/MAE (reporte, no crítico)
        run: python scripts/analizar_mfe.py

      # Rompe en rojo si no logra guardar, igual que el resto de la persistencia.
      # Un rojo AQUÍ significa que el reporte no se actualizó, no que se perdió
      # trabajo de trading: la bitácora y el estado ya están a salvo (job
      # `postcierre`, verificado por `verificar` arriba, ambos ajenos a este job).
      - name: Commit y push del reporte MFE/MAE
        run: |
          scripts/commit_y_push.sh \
            "análisis MFE/MAE de posiciones [skip ci]" \
            "procesado" \
            reportes

  # Publicación del dashboard de docs/ que sirve GitHub Pages. JOB APARTE por la
  # misma razón que `mfe`: es presentación, no trading. Va el ÚLTIMO (needs:
  # postcierre + mfe) para publicar ya con el informe MFE/MAE del día dentro; si
  # revienta, lo único que pasa es que la web se queda con los datos de ayer,
  # mientras que la bitácora, el estado y su verificación contra el remoto
  # quedaron cerrados y en verde varios jobs antes, sin depender de este.
  #
  # `always()` porque `mfe` puede quedar SKIPPED (solo corre si el escaneo
  # procesó de verdad) y sin esto arrastraría a este job al skip. La condición
  # real es la de abajo: se republica cuando el post-cierre trabajó, haya ido
  # como haya ido el reporte MFE.
  dashboard:
    needs: [postcierre, mfe]
    if: always() && needs.postcierre.result == 'success' && needs.postcierre.outputs.resultado == 'procesado'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `ref` explícito (la punta de la rama, no el SHA del evento): aquí ya han
      # commiteado `postcierre` y casi siempre `mfe`, y el dashboard tiene que
      # leer esos datos, no los de antes de que este run empezara.
      # `fetch-depth: 0` porque el sello de "última actualización" sale de un
      # `git log` sobre los ficheros de datos: con un clon superficial saldría
      # una fecha falsa.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar dashboard
        id: dash
        run: python scripts/generar_dashboard.py

      # Solo se commitea si el generador dice que cambió algo, y entonces se
      # exige de verdad: commit, push y confirmación contra el remoto. Así se
      # evita el commit diario de ruido sin comprarlo al precio de dejar de
      # comprobar la persistencia cuando sí había algo que guardar.
      - name: Commit y push del dashboard
        if: steps.dash.outputs.cambios == 'si'
        run: |
          scripts/commit_y_push.sh \
            "dashboard: republicado tras el post-cierre [skip ci]" \
            "procesado" \
            docs

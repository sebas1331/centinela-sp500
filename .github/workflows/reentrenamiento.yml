name: Reentrenamiento mensual

# Reentrenamiento walk-forward mensual (workflow largo). Corre el día 1 de cada
# mes a las 06:07 UTC (fuera de las ventanas de escaneo). Respeta la regla dura:
# no cambia umbral/features/stop sin >=30 operaciones cerradas nuevas.
on:
  schedule:
    - cron: "7 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: centinela-escritura
  cancel-in-progress: false

jobs:
  reentrenar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # `ref` explícito y no el SHA del evento: ver la explicación en
      # preapertura.yml (fallo del 2026-07-28 por checkout rancio en la cola).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # La clave lleva la fecha, no el id del run: así solo el PRIMER run del
      # día guarda caché nueva. Con una por run, la escalera de la pre-apertura
      # dejaba ~17 cachés de 135 MB al día, llenaba los 10 GB del repositorio en
      # cinco días y GitHub empezaba a desalojar por orden de último uso — y lo
      # que desalojaba era la sesión de XTB, que pesa 359 bytes.
      - name: Fecha de hoy, para la clave de caché
        id: dia
        run: echo "fecha=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restaurar caché de precios/histórico
        uses: actions/cache@v4
        with:
          path: .cache
          key: precios-${{ steps.dia.outputs.fecha }}-reentreno
          restore-keys: precios-

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Reentrenamiento mensual
        run: python scripts/reentrenar_mensual.py

      # Se le exige "procesado" a propósito. La regla dura puede impedir que
      # CAMBIE el umbral, pero el script siempre reajusta los pesos con datos
      # nuevos (modelo.guardar()) y siempre añade su entrada al CHANGELOG: si
      # termina sin dejar rastro en disco es que perdió su trabajo, no que no
      # tocaba trabajar. Antes aquí se pasaba un "omitido:" fijo y eso hacía que
      # un reentrenamiento sin salida pasara en verde.
      - name: Commit y push verificados (modelo, CHANGELOG)
        run: |
          scripts/commit_y_push.sh \
            "reentrenamiento mensual del modelo [skip ci]" \
            "procesado" \
            modelos datos CHANGELOG.md reportes

  # LA PÁGINA DE OPERATIVA. El reentrenamiento no está entre los componentes
  # críticos —que un mes no se reajusten los pesos no rompe el trading del día—,
  # pero sí aparece en la lista de la página, y un componente que no reporta
  # nunca se queda con un «nunca» perpetuo que no distingue «no tocaba» de
  # «lleva medio año roto».
  # LA SALUD de los componentes de este workflow. Va por el diario: no rebasa,
  # no choca y no tiene grupo de concurrencia, así que GitHub no la puede
  # cancelar por estar esperando turno (ver centinela/diario.py).
  salud:
    needs: [reentrenar]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Registrar el estado del reentrenamiento
        run: |
          python scripts/registrar_salud.py reentrenamiento \
            --job "${{ needs.reentrenar.result }}"

      - name: Publicar la salud (diario, sin rebase)
        run: |
          python scripts/publicar_diario.py --mensaje "salud: reentrenamiento [skip ci]"

  # LA PÁGINA, regenerada en el grupo ÚNICO `centinela-operativa` que comparten
  # todos los workflows (ver pagina_operativa.yml). Antes cada workflow tenía
  # el suyo y chocaban entre sí: 13 rojos "could not apply" en una semana.
  operativa:
    needs: [salud]
    if: always()
    permissions:
      contents: write
    uses: ./.github/workflows/pagina_operativa.yml
    with:
      mensaje: "operativa: republicada tras el reentrenamiento [skip ci]"

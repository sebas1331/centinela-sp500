name: Escaneo pre-apertura

# ---------------------------------------------------------------------------
# POR QUÉ ESTA ESCALERA DE CRONS ES ASÍ (fallo del 2026-07-27)
#
# El cron de Actions corre en UTC, no entiende el horario de verano y, sobre
# todo, SE RETRASA MUCHO: el 2026-07-27 los cinco disparos programados entre las
# 10:45 y las 12:45 UTC arrancaron entre 2h14m y 2h55m tarde, los cinco ya
# pasada la apertura. Los cinco escaneos murieron por ventana, en verde, y la
# sesión se perdió sin que nada lo delatara.
#
# La clave del problema es que es ASIMÉTRICO:
#   - Llegar TARDE es irrecuperable. La ventana tiene un techo duro 20 min antes
#     de la apertura, porque el post-cierre simula la compra al open oficial:
#     decidir después del open sería mirar el precio al que luego se compra.
#   - Llegar PRONTO no cuesta nada. Los datos son del cierre anterior.
#
# Así que ahora se dispara MUY por delante y el run que llega pronto DUERME
# hasta que su ventana abre (hasta 120 min, ver ESPERA_VENTANA_MAX_MIN) en vez
# de morir.
#
# ---------------------------------------------------------------------------
# EL FALLO DEL 2026-08-27: LA ESCALERA DE ~5 h SE QUEDÓ CORTA
#
# Aquel día los SIETE disparos se retrasaron entre 9h40m y 10h57m (el cron de
# las 08:03 UTC creó su run a las 19:00 UTC). Los siete aterrizaron pasada la
# apertura y los siete murieron en rojo con `fallo:ventana-perdida`: el diseño
# funcionó —el silencio ya no existe, el rojo se vio— pero la sesión se perdió
# igual, porque ningún peldaño de la escalera podía llegar a tiempo.
#
# La API de Actions lo deja claro: en los siete runs `createdAt == startedAt`.
# El retraso NO está en la cola de runners ni en el job; está ANTES, en el
# scheduler de cron de GitHub, que ese día tardó ~10 h en disparar. Contra eso
# no hay código que valga: solo se puede salir todavía más por delante.
#
# La escalera pasa de 7 a 16 peldaños y arranca a las 00:33 UTC del mismo día.
# Con eso el sistema aguanta retrasos de 0 a ~12 h en ambos regímenes horarios
# (verificado peldaño a peldaño y a paso de 5 min por el test de abajo), más del
# doble del peor retraso jamás observado. Los peldaños de madrugada casi siempre
# terminarán en verde con "omitido:antes-de-ventana" en menos de un minuto: son
# baratos y solo existen para el día en que GitHub vuelva a irse 10 h.
# ---------------------------------------------------------------------------
#
# Ventana válida (20 a 240 min antes de la apertura de las 09:30 ET):
#   verano  (EDT, apertura 13:30 UTC) -> 09:30-13:10 UTC
#   invierno (EST, apertura 14:30 UTC) -> 10:30-14:10 UTC
#
# Los minutos son "raros" a propósito: la cola de Actions se congestiona en los
# minutos redondos y en las horas en punto.
#
# El test test_escalera_de_crons_preapertura_aguanta_retrasos comprueba esta
# escalera contra todo el rango de retrasos (0-12 h) en ambos regímenes, y
# test_regresion_2026_08_27_retraso_de_diez_horas la comprueba contra los
# retrasos reales de aquel día. Si tocas los crons, esos tests te dirán si acabas
# de reabrir el agujero.
# ---------------------------------------------------------------------------
on:
  schedule:
    - cron: "33 0 * * 1-5"
    - cron: "23 1 * * 1-5"
    - cron: "13 2 * * 1-5"
    - cron: "3 3 * * 1-5"
    - cron: "53 3 * * 1-5"
    - cron: "43 4 * * 1-5"
    - cron: "33 5 * * 1-5"
    - cron: "23 6 * * 1-5"
    - cron: "13 7 * * 1-5"
    - cron: "3 8 * * 1-5"
    - cron: "53 8 * * 1-5"
    - cron: "43 9 * * 1-5"
    - cron: "33 10 * * 1-5"
    - cron: "23 11 * * 1-5"
    - cron: "13 12 * * 1-5"
    - cron: "3 13 * * 1-5"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Forzar (ignora ventana e idempotencia)"
        type: boolean
        default: false
      fecha:
        description: "Fecha de sesión YYYY-MM-DD (opcional)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: centinela-escritura
  cancel-in-progress: false

jobs:
  preapertura:
    runs-on: ubuntu-latest
    # Generoso: el run puede pasarse hasta 120 min dormido esperando su ventana.
    timeout-minutes: 160
    outputs:
      resultado: ${{ steps.escaneo.outputs.resultado }}
    steps:
      # `ref` explícito, NO el SHA del evento. Sin esto, un disparo que espera su
      # turno en la cola de concurrencia se traería el estado de cuando se ENCOLÓ,
      # no el de cuando arranca. El 2026-07-28 pasó justo eso: el disparo de las
      # 12:19 UTC esperó a que el de las 11:04 terminara su escaneo, pero al
      # arrancar leyó un estado.json anterior a ese commit, no vio la marca de
      # idempotencia, repitió el escaneo entero y murió en un conflicto de rebase.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restaurar caché de precios
        uses: actions/cache@v4
        with:
          path: .cache
          key: precios-${{ github.run_id }}
          restore-keys: precios-

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Sale en ROJO si pierde la ventana de decisión de un día bursátil.
      - name: Escaneo pre-apertura
        id: escaneo
        run: |
          ARGS=""
          if [ "${{ inputs.forzar }}" = "true" ]; then ARGS="$ARGS --forzar"; fi
          if [ -n "${{ inputs.fecha }}" ]; then ARGS="$ARGS --fecha ${{ inputs.fecha }}"; fi
          python scripts/escaneo_preapertura.py $ARGS

      # Rompe en rojo si el escaneo trabajó pero su salida no llegó al repo.
      - name: Commit y push verificados (bitácora, estado, logs)
        run: |
          scripts/commit_y_push.sh \
            "pre-apertura: decisiones de entrada [skip ci]" \
            "${{ steps.escaneo.outputs.resultado }}" \
            estado bitacora.csv bitacora.sqlite datos logs reportes

  # Segunda opinión INDEPENDIENTE: clona el repo de nuevo desde GitHub y
  # comprueba contra el remoto de verdad (no contra el checkout del job de
  # arriba, que podría mentir) que la cabeza de main la escribió el bot en ESTE
  # run. Si el escaneo dijo "procesado" y el remoto no lo refleja, rojo.
  verificar:
    needs: preapertura
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Verificar persistencia en el remoto
        env:
          RESULTADO: ${{ needs.preapertura.outputs.resultado }}
          ESTADO_JOB: ${{ needs.preapertura.result }}
        run: bash scripts/verificar_persistencia.sh

  # Traduce las decisiones del escaneo a órdenes concretas para el broker y las
  # deja en ordenes/pendientes.json, que es lo que el ejecutor del Mac lee al
  # despertarse. JOB APARTE, como el dashboard: si esto falla, la sesión de
  # trading ya está persistida y verificada dos jobs antes. Lo único que pasa
  # es que ese día no se opera en XTB, y el Vigilante lo denuncia.
  #
  # No habla con XTB ni tiene credenciales: solo escribe un fichero.
  ordenes:
    needs: preapertura
    if: needs.preapertura.result == 'success' && needs.preapertura.outputs.resultado == 'procesado'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Restaurar caché de precios
        uses: actions/cache@v4
        with:
          path: .cache
          key: precios-${{ github.run_id }}
          restore-keys: precios-

      - name: Generar las órdenes del día
        run: python scripts/generar_ordenes.py preapertura

      - name: Commit y push de las órdenes
        run: |
          scripts/commit_y_push.sh \
            "órdenes para el broker: preapertura [skip ci]" \
            "procesado" \
            ordenes

  # EL EJECUTOR. Manda a XTB lo que el escaneo decidió, en un JOB APARTE con
  # `needs`: cuando corre, la bitácora y el estado ya están persistidos y
  # VERIFICADOS contra el remoto. Un fallo del broker se ve en rojo y no
  # revierte ni bloquea nada de la sesión de trading.
  #
  # Vivía en un Mac con launchd porque las credenciales de XTB abren también
  # las cuentas reales del titular. Con esas cuentas vacías ese motivo
  # desapareció, y lo otro —si el login de xStation5 funciona desde una IP de
  # datacenter— se comprobó con `probar_broker.yml`: funciona, y reutilizando
  # la sesión de la caché conecta en 2 segundos sin pedir segundo factor.
  ejecutor:
    needs: preapertura
    if: needs.preapertura.result == 'success' && needs.preapertura.outputs.resultado == 'procesado'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-broker.txt

      # El login de xStation5 pasa por un WAF que bloquea el camino REST, así
      # que la librería cae a un navegador de verdad.
      - name: Instalar Chromium para el login
        run: playwright install --with-deps chromium

      # La sesión de XTB dura 8 h y cada runner es una máquina nueva. Sin esta
      # caché, XTB trataría cada ejecución como un dispositivo nuevo y pediría
      # un código por correo que aquí no hay quien lea.
      - name: Restaurar sesión de XTB
        uses: actions/cache@v4
        with:
          path: |
            ~/.centinela_xtb_session
            ~/.centinela_xtb_ticket.json
            ~/.centinela_xtb_cookies.json
          key: xtb-sesion-${{ github.run_id }}
          restore-keys: xtb-sesion-

      - name: Ejecutar en el broker (compras)
        id: ejecutor
        env:
          XTB_EMAIL: ${{ secrets.XTB_EMAIL }}
          XTB_CUENTA: ${{ secrets.XTB_CUENTA }}
          XTB_PASSWORD: ${{ secrets.XTB_PASSWORD }}
        run: python scripts/ejecutor_xtb.py compras --sin-git

      # Se commitea SIEMPRE que el ejecutor haya escrito algo, aunque terminara
      # en rojo: si mandó tres órdenes y falló en la cuarta, las tres primeras
      # tienen que quedar registradas o el siguiente disparo las repetiría.
      - name: Commit y push de lo ejecutado
        if: always()
        run: |
          scripts/commit_y_push.sh \
            "ejecutor XTB: compras [skip ci]" \
            "$(git diff --quiet -- estado bitacora_broker.csv ordenes && echo omitido:sin-notificaciones || echo procesado)" \
            estado bitacora_broker.csv ordenes

  # LA PÁGINA DE OPERATIVA (docs/operativa.html). JOB APARTE, el último, con
  # `needs` e `if: always()`. Cada una de las tres cosas está ahí por un motivo:
  #
  #   needs      -> cuando esto corre, la bitácora, el estado y la bitácora del
  #                 broker ya están persistidos y verificados. Publicar una
  #                 página no puede estropear nada de eso.
  #   always()   -> la página tiene que contar sobre todo los días malos. Si
  #                 solo corriera detrás de un éxito enseñaría un verde
  #                 permanente, que es peor que no tener página.
  #   el último  -> el ejecutor ya escribió y empujó su parte de salud.json, así
  #                 que este checkout la trae.
  operativa:
    needs: [preapertura, ejecutor]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Solo para saber CUÁNDO caduca la sesión y poder avisar antes. Se usa
      # `cache/restore` y no `cache` a propósito: un job que no habla con el
      # broker no debe poder sobrescribir la sesión al terminar.
      - name: Leer la caducidad de la sesión de XTB
        uses: actions/cache/restore@v4
        with:
          path: ~/.centinela_xtb_session
          key: xtb-sesion-
          restore-keys: xtb-sesion-

      # El escaneo no se registra a sí mismo: lo hace este job, que ve su
      # `result` aunque el runner se muriera sin que el script dijera nada.
      - name: Registrar el estado del escaneo
        run: |
          python scripts/registrar_salud.py preapertura \
            --salida "${{ needs.preapertura.outputs.resultado }}" \
            --job "${{ needs.preapertura.result }}"

      # El ejecutor SÍ se registra a sí mismo y con mucho más detalle (candado,
      # sesión caducada, diferencias). `--solo-si-falta` respeta su versión y
      # solo escribe cuando murió antes de poder contarla.
      - name: Registrar el estado del ejecutor
        run: |
          python scripts/registrar_salud.py compras \
            --job "${{ needs.ejecutor.result }}" --solo-si-falta

      - name: Generar la página de operativa
        id: op
        run: python scripts/generar_operativa.py

      - name: Commit y push de la operativa
        if: steps.op.outputs.cambios == 'si'
        run: |
          scripts/commit_y_push.sh \
            "operativa: republicada tras la pre-apertura [skip ci]" \
            "procesado" \
            docs estado
